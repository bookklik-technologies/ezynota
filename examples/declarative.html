<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ezynota - Declarative embed</title>
  <link rel="stylesheet" href="../dist/ezynota.css" />
</head>
<body>
  <!-- The bundle automatically initializes this element from its attributes. -->
  <div
    data-ezn-editor
    data-ezn-mode="embedded"
    data-ezn-placeholder="Start writing..."
    aria-label="Text editor"
  ></div>

  <script src="../dist/ezynota.umd.cjs"></script>
</body>
</html>
